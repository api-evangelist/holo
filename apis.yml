name: Holo
description: 'Holo (Holo AM, operating under Greene Group Industries) is an advanced
  metal additive manufacturing company founded in 2017 and backed by Lightspeed Venture
  Partners. Its PureForm metal 3D printing platform uses digital light processing (DLP)
  with metal powder-filled photopolymer resins to produce high-resolution, complex
  metal components with features as small as 50 microns, in pure copper, stainless
  steels (17-4PH, 316), and in-development cobalt alloy, titanium, nickel superalloys,
  tool steels, and alumina. Customers submit CAD files and receive prototyped-to-production
  parts with roughly two-week turnaround, serving medical technology, precision micro-robotics,
  and general advanced manufacturing. Holo is a hardware manufacturer and does not
  publish a public developer API.'
